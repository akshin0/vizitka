<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111111">
<title>Akşin Abaslı — Vizitka</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(135deg,#0b0b0d,#202025);
  color:#fff; display:flex; justify-content:center; align-items:center;
  padding:24px;
}
.card{
  width:100%; max-width:430px; padding:34px 22px 26px;
  border:1px solid rgba(255,255,255,.12); border-radius:28px;
  background:rgba(20,20,23,.88); box-shadow:0 20px 60px rgba(0,0,0,.45);
  text-align:center; backdrop-filter:blur(12px);
}
.avatar{
  width:110px;height:110px;margin:0 auto 18px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#444,#111);
  border:3px solid #fff;font-size:42px;font-weight:700;
}
h1{margin:0;font-size:29px}
.role{margin:8px 0 25px;color:#aaa;font-size:15px}
.links{display:grid;gap:12px}
a{
  display:flex;align-items:center;justify-content:center;gap:10px;
  text-decoration:none;color:#fff;background:#29292e;
  padding:15px;border-radius:15px;font-weight:600;
  transition:.2s; border:1px solid rgba(255,255,255,.06)
}
a:hover{transform:translateY(-2px);background:#35353b}
.save{background:#fff;color:#111;margin-top:8px}
.save:hover{background:#e9e9e9}
.footer{margin-top:24px;color:#777;font-size:12px}
</style>
</head>
<body>
<main class="card">
  <div class="avatar">AA</div>
  <h1>Akşin Abaslı</h1>
  <div class="role">Rəqəmsal vizitka</div>

  <div class="links">
    <a href="https://www.instagram.com/akshinabasli12" target="_blank" rel="noopener">
       Instagram
    </a>
    <a href="https://www.tiktok.com/@akshin.abasli3" target="_blank" rel="noopener">
       TikTok
    </a>
    <a href="tel:+994558555205" class="button">
  📞 Zəng et
</a>
    <a class="save" href="#" onclick="downloadVCard();return false;">
      📇 Kontaktı yadda saxla
    </a>
  </div>

  <div class="footer"></div>
</main>

<script>
function downloadVCard(){
  const vcard =
`BEGIN:VCARD
VERSION:3.0
FN:Akşin Abaslı
N:Abaslı;Akşin;;;
URL:https://www.instagram.com/akshinabasli12
X-SOCIALPROFILE;TYPE=tiktok:https://www.tiktok.com/@akshin.abasli3
END:VCARD`;
  const blob=new Blob([vcard],{type:"text/vcard;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download="Aksin-Abasli.vcf";a.click();
  URL.revokeObjectURL(url);
}
</script>
</body>
</html>
